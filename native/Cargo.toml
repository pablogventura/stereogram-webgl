[package]
name = "estereograma"
version = "0.1.0"
edition = "2021"
description = "Generador nativo de estereogramas acelerado por GPU"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
pollster = "0.4"
rfd = "0.15"
wgpu = "24"
winit = "0.30"
